[project]
name = "tilhero-support"
version = "0.1.0"
description = "TilHero support-service: обращения, сообщения, статусы, SLA, эскалации"
requires-python = ">=3.12"
dependencies = ["tilhero-common"]

[tool.uv.sources]
tilhero-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilhero_support"]
