[project]
name = "tilhero-admin-identity"
version = "0.1.0"
description = "TilHero admin-identity: учётки сотрудников, вход (пароль, must_change_password, TOTP MFA), роли и права, four-eyes"
requires-python = ">=3.12"
dependencies = ["tilhero-common", "argon2-cffi>=23.1"]

[tool.uv.sources]
tilhero-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilhero_admin_identity"]
