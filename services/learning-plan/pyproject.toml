[project]
name = "tilhero-learning-plan"
version = "0.1.0"
description = "TilHero learning-plan-service: цель, уровень, языки, график занятий и длительность, учёт занятий, напоминания и пропуски"
requires-python = ">=3.12"
dependencies = ["tilhero-common"]

[tool.uv.sources]
tilhero-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilhero_learning_plan"]
