[project]
name = "tilhero-catalog"
version = "0.1.0"
description = "TilHero catalog: языки и пары, курс, навыки, уроки, рубрики, сценарии, медиа с правами, заявки, версии и публикация"
requires-python = ">=3.12"
dependencies = ["tilhero-common"]

[tool.uv.sources]
tilhero-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilhero_catalog"]
