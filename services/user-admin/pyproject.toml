[project]
name = "tilhero-user-admin"
version = "0.1.0"
description = "TilHero user-admin: read-модель пользователей для админки, маскирование PII"
requires-python = ">=3.12"
dependencies = ["tilhero-common"]

[tool.uv.sources]
tilhero-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilhero_user_admin"]
