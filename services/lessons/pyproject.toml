[project]
name = "tilhero-lessons"
version = "0.1.0"
description = "TilHero lessons: оркестратор урока 20 минут — сессии урока, сценария и медиа, этапы и шаги, пауза и восстановление, итоги"
requires-python = ">=3.12"
dependencies = ["tilhero-common"]

[tool.uv.sources]
tilhero-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilhero_lessons"]
