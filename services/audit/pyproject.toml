[project]
name = "tilhero-audit"
version = "0.1.0"
description = "TilHero audit-service: append-only журнал административных и security-действий с хеш-цепочкой"
requires-python = ">=3.12"
dependencies = ["tilhero-common"]

[tool.uv.sources]
tilhero-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilhero_audit"]
