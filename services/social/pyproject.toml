[project]
name = "tilhero-social"
version = "0.1.0"
description = "TilHero social-service: приглашения (семья, друг, реферал) по deep link, семья, друзья"
requires-python = ">=3.12"
dependencies = ["tilhero-common"]

[tool.uv.sources]
tilhero-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilhero_social"]
