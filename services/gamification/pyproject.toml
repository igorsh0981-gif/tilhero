[project]
name = "tilhero-gamification"
version = "0.1.0"
description = "TilHero gamification: реестр XP, тилов и заморозок, уровни, герои и ступени, задания дня, значки, магазин, события недели, правила игры с версиями"
requires-python = ">=3.12"
dependencies = ["tilhero-common"]

[tool.uv.sources]
tilhero-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilhero_gamification"]
