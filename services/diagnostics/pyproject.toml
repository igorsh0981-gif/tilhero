[project]
name = "tilhero-diagnostics"
version = "0.1.0"
description = "TilHero diagnostics: входная диагностика, профиль навыков, карта навыков ученика"
requires-python = ">=3.12"
dependencies = ["tilhero-common"]

[tool.uv.sources]
tilhero-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilhero_diagnostics"]
