[project]
name = "tilhero-identity"
version = "0.1.0"
description = "TilHero identity-consent: аккаунт Telegram, ученики и опекунство, возраст, согласия, согласие родителя 14–17, код родителя, настройки уведомлений, сага удаления"
requires-python = ">=3.12"
dependencies = ["tilhero-common", "argon2-cffi>=23.1"]

[tool.uv.sources]
tilhero-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilhero_identity"]
