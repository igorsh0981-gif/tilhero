[project]
name = "tilhero-identity"
version = "0.1.0"
description = "TilHero identity-consent: профиль Telegram, 18+, согласия, PIN, биометрия, статус, запрос удаления"
requires-python = ">=3.12"
dependencies = ["tilhero-common", "argon2-cffi>=23.1"]

[tool.uv.sources]
tilhero-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilhero_identity"]
