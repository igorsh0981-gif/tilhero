[project]
name = "tilhero-billing"
version = "0.1.0"
description = "TilHero billing: каталог тарифов и товаров с версиями (сумы и Stars), заказы по каналам, платёжный контур и адаптеры (Telegram Stars, Payme, Click, Uzum), фискальные данные, периоды подписки, реестр минут с удержаниями, возвраты, корректировки «четыре глаза», сверка, отчёты"
requires-python = ">=3.12"
dependencies = ["tilhero-common"]

[tool.uv.sources]
tilhero-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilhero_billing"]
