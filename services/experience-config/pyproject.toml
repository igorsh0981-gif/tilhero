[project]
name = "tilhero-experience"
version = "0.1.0"
description = "TilHero experience-config-service: версии темы, секций Home и флагов с откатом"
requires-python = ">=3.12"
dependencies = ["tilhero-common"]

[tool.uv.sources]
tilhero-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilhero_experience"]
