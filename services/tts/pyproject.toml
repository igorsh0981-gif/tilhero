[project]
name = "tilhero-tts"
version = "0.1.0"
description = "TilHero tts: серверная озвучка английских фраз контента (Piper, MP3) — аудирование теста, «Прослушать» в разговоре, медиа без файла"
requires-python = ">=3.12"
dependencies = [
    "tilhero-common",
    "piper-tts>=1.3",
    "lameenc>=1.7",
    "faster-whisper>=1.1",
]

[tool.uv.sources]
tilhero-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilhero_tts"]
