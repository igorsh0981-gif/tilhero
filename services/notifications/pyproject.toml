[project]
name = "tilhero-notifications"
version = "0.1.0"
description = "TilHero notifications: политика доставки, шаблоны RU/UZ, центр уведомлений, доставка в Telegram"
requires-python = ">=3.12"
dependencies = ["tilhero-common"]

[tool.uv.sources]
tilhero-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilhero_notifications"]
