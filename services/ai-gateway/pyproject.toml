[project]
name = "tilhero-ai-gateway"
version = "0.1.0"
description = "TilHero ai-gateway: реестр агентов и версии инструкций, золотые тесты, маршрутизация моделей, бюджеты, вызов агента со строгой проверкой и правилами безопасности"
requires-python = ">=3.12"
dependencies = ["tilhero-common"]

[tool.uv.sources]
tilhero-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilhero_ai_gateway"]
