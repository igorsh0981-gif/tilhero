[project]
name = "tilhero-common"
version = "0.1.0"
description = "TilHero: общий каркас Python-сервисов (настройки, логи, ошибки, health, БД, outbox/inbox, NATS, внутренний JWT, idempotency, HTTP-клиент)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "redis>=5.2",
  "nats-py>=2.9",
  "httpx>=0.28",
  "pyjwt[crypto]>=2.10",
  "tzdata>=2026.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilhero_common"]
