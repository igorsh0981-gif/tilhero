[project]
name = "tilhero-botgw"
version = "0.1.0"
description = "TilHero telegram-bot-gateway: webhook, команды, доставка сообщений в Telegram"
requires-python = ">=3.12"
dependencies = ["tilhero-common"]

[tool.uv.sources]
tilhero-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilhero_botgw"]
