<!doctype html>
<html lang="ru" data-theme="notebook" data-scheme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>TilHero</title>
    <!-- Telegram Mini Apps bridge (window.Telegram.WebApp). Accessed only through src/tg/. -->
    <script src="https://telegram.org/js/telegram-web-app.js?59"></script>
    <!-- The saved light / dark choice before the first paint (public/theme-boot.js, mirrors src/tg/theme.ts). -->
    <script src="/theme-boot.js"></script>
    <!-- Brand fonts never block rendering: preconnect + preload here, the stylesheet is attached by src/fonts.ts
         (display=swap; size-matched fallbacks in @tilhero/ui-tokens base.css). Keep the URL in sync with fonts.ts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&family=Caveat:wght@500;600&display=swap"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>TilHero работает внутри Telegram. Включите JavaScript. · TilHero Telegram ichida ishlaydi. JavaScriptʼni yoqing.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
